<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07030d"><title>Ghost Phoenix v0.03A</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#15092a 0,#07030d 42%,#020204 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#app{max-width:430px;min-height:100vh;margin:0 auto}.phone{min-height:100vh;padding:74px 22px 112px;position:relative}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{height:154px;border-radius:24px;border:1px solid rgba(129,48,194,.72);background:radial-gradient(circle at 50% 24%,rgba(142,51,255,.16),transparent 48%),linear-gradient(180deg,rgba(11,7,19,.96),rgba(2,2,6,.99));box-shadow:inset 0 0 0 1px rgba(255,255,255,.035),inset 0 0 22px rgba(135,60,255,.08),0 10px 26px rgba(0,0,0,.78);color:#fff;text-align:center;padding:20px 8px 14px;position:relative;overflow:hidden}.card::before{content:"";position:absolute;width:118px;height:118px;left:50%;top:8px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(184,79,255,.35) 0,rgba(123,38,221,.22) 38%,transparent 70%);filter:blur(2px)}.orb{width:82px;height:82px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 48% 38%,rgba(232,204,255,.32),rgba(168,80,255,.34) 28%,rgba(73,20,129,.94) 52%,rgba(8,3,15,.99) 100%);border:1px solid rgba(191,97,255,.78);box-shadow:0 0 18px rgba(180,72,255,.92),0 0 42px rgba(135,60,255,.54),inset 0 0 24px rgba(135,60,255,.35);z-index:1}.orb::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 120deg,transparent,rgba(154,57,255,.34),transparent,rgba(234,204,255,.22),transparent);filter:blur(3px)}.orb svg{width:51px;height:51px;fill:none;stroke:#e7caff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #e2b6ff) drop-shadow(0 0 13px #873cff);z-index:2}.ghost{width:52px;height:52px;position:relative;z-index:2;filter:drop-shadow(0 0 7px #e2b6ff) drop-shadow(0 0 13px #873cff)}.ghost:before{content:"";position:absolute;inset:5px 8px 6px;background:#e7caff;border-radius:24px 24px 12px 12px;clip-path:polygon(0 6%,100% 6%,100% 80%,84% 69%,68% 84%,50% 70%,32% 84%,16% 69%,0 80%)}.ghost:after{content:"";position:absolute;top:23px;left:20px;width:5px;height:5px;border-radius:50%;background:#16071f;box-shadow:13px 0 0 #16071f}.card span{display:block;position:relative;z-index:1;font-size:21px;line-height:1.05;font-weight:380;letter-spacing:-.5px;text-shadow:0 2px 8px #000}.card small{display:block;position:relative;z-index:1;margin-top:8px;font-size:13px;color:#cdb9eb;font-weight:300}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));height:92px;border-radius:36px;border:1px solid rgba(126,45,194,.86);background:radial-gradient(circle at 25% 35%,rgba(151,56,255,.18),transparent 38%),linear-gradient(180deg,rgba(10,6,19,.96),rgba(2,2,6,.99));box-shadow:inset 0 0 20px rgba(135,60,255,.14),0 8px 25px rgba(0,0,0,.8),0 0 24px rgba(135,60,255,.24);display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;padding:10px 12px;z-index:10}.line{width:1px;height:54px;background:rgba(159,103,216,.42);box-shadow:0 0 12px #873cff}.nav button{background:transparent;border:0;color:#e3d7ef;display:grid;place-items:center;gap:4px;font-size:13px;font-weight:350}.navOrb{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 48% 38%,rgba(232,204,255,.24),rgba(168,80,255,.25) 28%,rgba(65,18,117,.96) 56%,rgba(8,3,15,.99) 100%);border:1px solid rgba(191,97,255,.70);box-shadow:0 0 16px rgba(180,72,255,.82),0 0 34px rgba(135,60,255,.42),inset 0 0 18px rgba(135,60,255,.26)}.nav .active .navOrb{border-color:#d7a3ff;box-shadow:0 0 20px rgba(215,163,255,.9),0 0 45px rgba(135,60,255,.62),inset 0 0 20px rgba(135,60,255,.38)}.navOrb svg{width:34px;height:34px;fill:none;stroke:#e7caff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #e2b6ff) drop-shadow(0 0 12px #873cff)}.nav .active{color:#c979ff}.calc{padding:28px 22px 112px}.calcTitle{text-align:center;font-weight:800;font-size:22px;margin-bottom:15px;color:#ded7e9}.calcDisplay{height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px;overflow:hidden}.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calcGrid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:#fff;font-size:24px;font-weight:700}.calcGrid .op{background:#33234b;color:#c79bff}.calcGrid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}@media(max-width:390px){.phone{padding:70px 20px 108px}.grid{gap:11px}.card{height:146px;padding-top:18px}.orb{width:76px;height:76px;margin-bottom:13px}.orb svg{width:47px;height:47px}.card span{font-size:20px}.card small{font-size:12.2px}.nav{height:88px}.navOrb{width:54px;height:54px}}
</style></head><body><main id="app"></main><script>
const app=document.getElementById('app');const icons={photo:'<svg viewBox="0 0 64 64"><rect x="10" y="15" width="44" height="34" rx="8"/><circle cx="24" cy="27" r="4.8"/><path d="M16 45l13-12 8 7 5-5 8 10"/></svg>',video:'<svg viewBox="0 0 64 64"><rect x="10" y="17" width="34" height="30" rx="8"/><path d="M44 27l11-7v24l-11-7z"/></svg>',files:'<svg viewBox="0 0 64 64"><path d="M11 20h18l6 7h18v23H11z"/><path d="M11 27h42"/></svg>',notes:'<svg viewBox="0 0 64 64"><rect x="17" y="10" width="30" height="44" rx="6"/><path d="M25 23h14M25 32h14M25 41h9"/><path d="M41 10v9h6"/></svg>',browser:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22"/><path d="M10 32h44M32 10c7 8 7 36 0 44M32 10c-7 8-7 36 0 44"/></svg>',home:'<svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z"/></svg>',hide:'<svg viewBox="0 0 64 64"><path d="M7 32s9-15 25-15 25 15 25 15-9 15-25 15S7 32 7 32z"/><path d="M17 50L50 14"/></svg>'};
function nav(active){return '<div class="nav"><button class="'+(active==='home'?'active':'')+'" onclick="dashboard()"><span class="navOrb">'+icons.home+'</span>Home</button><div class="line"></div><button class="'+(active==='hide'?'active':'')+'" onclick="calculator()"><span class="navOrb">'+icons.hide+'</span>Hide</button></div>'}
function card(t,s,i,g){return '<button class="card" onclick="alert(\''+t+' shell coming next\')"><span class="orb">'+(g?'<span class="ghost"></span>':i)+'</span><span>'+t+'</span><small>'+s+'</small></button>'}
function dashboard(){app.innerHTML='<section class="phone"><div class="grid">'+card('Photo Vault','Pictures & albums',icons.photo)+card('Video Vault','Clips & private videos',icons.video)+card('Files Vault','Documents & folders',icons.files)+card('Notes Vault','Private notes',icons.notes)+card('Browser','Secure search',icons.browser)+card('Contacts','Private chats','',true)+'</div>'+nav('home')+'</section>'}
function calculator(){app.innerHTML='<section class="phone calc"><div class="calcTitle">Calculator</div><div id="display" class="calcDisplay">0</div><div class="calcGrid">'+["C","±","%","÷","7","8","9","×","4","5","6","-","1","2","3","+","0",".","⌫","="].map(k=>'<button class="'+(["÷","×","-","+","="].includes(k)?"op":"")+' '+(k==="="?"eq":"")+'" onclick="press(\''+k+'\')">'+k+'</button>').join('')+'</div>'+nav('hide')+'</section>'}
let v='0';function press(k){if(k==='C')v='0';else if(k==='⌫')v=v.length>1?v.slice(0,-1):'0';else if(k==='='){try{v=String(Function('return '+v.replaceAll('×','*').replaceAll('÷','/'))())}catch(e){v='Error'}}else if(k==='±'){if(v!=='0'&&v!=='Error')v=v.startsWith('-')?v.slice(1):'-'+v}else{v=(v==='0'||v==='Error')?k:v+k}let d=document.getElementById('display');if(d)d.textContent=v}dashboard();
</script></body></html>
