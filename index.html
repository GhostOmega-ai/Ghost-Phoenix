<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07030d"><title>Ghost Phoenix Clean v0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#15092a 0,#07030d 42%,#020204 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}button,input,textarea,select{font:inherit}button,label{cursor:pointer}#app{max-width:430px;min-height:100vh;margin:0 auto}.page{min-height:100vh;padding:74px 22px 112px;position:relative;animation:fade .15s ease}@keyframes fade{from{opacity:.72;transform:translateY(4px)}to{opacity:1;transform:none}}.top{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center;margin:-42px 0 14px}.top h1{margin:0;font-size:27px;text-align:center}.top p{margin:5px 0 0;color:#cbb8ea;font-size:13px;text-align:center}.ib{height:48px;border-radius:17px;border:1px solid #873cff88;background:#100817;color:white;font-size:24px}.panel{border:1px solid #8130c2b8;border-radius:24px;background:linear-gradient(180deg,#0b071ff5,#020206fc);box-shadow:inset 0 0 22px #873cff14,0 10px 26px #000c}.primary{border:0;border-radius:16px;background:linear-gradient(180deg,#a75bff,#6620ed);color:white;font-weight:900;padding:13px 14px;box-shadow:0 0 15px #873cff77}.secondary{border:1px solid #873cff88;border-radius:16px;background:#11101c;color:white;font-weight:800;padding:13px 14px}.danger{background:#ff514f!important}.empty{text-align:center;color:#cbb8ea;padding:36px 12px}.empty b{font-size:48px;display:block;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{height:154px;border-radius:24px;border:1px solid #8130c2b8;background:radial-gradient(circle at 50% 24%,#8e33ff29,transparent 48%),linear-gradient(180deg,#0b071ff5,#020206fc);box-shadow:inset 0 0 22px #873cff14,0 10px 26px #000c;color:#fff;text-align:center;padding:20px 8px 14px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:118px;height:118px;left:50%;top:8px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#b84fff59,#7b26dd38 38%,transparent 70%);filter:blur(2px)}.orb{width:82px;height:82px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 48% 38%,#e8ccff52,#a850ff57 28%,#491481f0 52%,#08030ffd 100%);border:1px solid #bf61ffc7;box-shadow:0 0 18px #b448ffeb,0 0 42px #873cff8a,inset 0 0 24px #873cff59;z-index:1}.orb:before{content:"";position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 120deg,transparent,#9a39ff57,transparent,#eaccff38,transparent);filter:blur(3px)}svg{fill:none;stroke:#e7caff;stroke-linecap:round;stroke-linejoin:round}.orb svg{width:51px;height:51px;stroke-width:2.8;filter:drop-shadow(0 0 6px #e2b6ff) drop-shadow(0 0 13px #873cff);z-index:2}.ghost{width:52px;height:52px;position:relative;z-index:2;filter:drop-shadow(0 0 7px #e2b6ff) drop-shadow(0 0 13px #873cff)}.ghost:before{content:"";position:absolute;inset:5px 8px 6px;background:#e7caff;border-radius:24px 24px 12px 12px;clip-path:polygon(0 6%,100% 6%,100% 80%,84% 69%,68% 84%,50% 70%,32% 84%,16% 69%,0 80%)}.ghost:after{content:"";position:absolute;top:23px;left:20px;width:5px;height:5px;border-radius:50%;background:#16071f;box-shadow:13px 0 0 #16071f}.card span{display:block;position:relative;z-index:1;font-size:21px;line-height:1.05;font-weight:380}.card small{display:block;position:relative;z-index:1;margin-top:8px;font-size:13px;color:#cbb8ea}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));height:92px;border-radius:36px;border:1px solid #7e2dc2db;background:radial-gradient(circle at 25% 35%,#9738ff2e,transparent 38%),linear-gradient(180deg,#0a061ff5,#020206fc);box-shadow:inset 0 0 20px #873cff24,0 8px 25px #000c,0 0 24px #873cff3d;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;padding:10px 12px;z-index:10}.line{width:1px;height:54px;background:#9f67d86b;box-shadow:0 0 12px #873cff}.nav button{background:transparent;border:0;color:#e3d7ef;display:grid;place-items:center;gap:4px;font-size:13px}.navOrb{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 48% 38%,#e8ccff3d,#a850ff40 28%,#411275f5 56%,#08030ffd 100%);border:1px solid #bf61ffb3;box-shadow:0 0 16px #b448ffd1,0 0 34px #873cff6b,inset 0 0 18px #873cff42}.nav .active .navOrb{border-color:#d7a3ff;box-shadow:0 0 20px #d7a3ffe6,0 0 45px #873cff9e,inset 0 0 20px #873cff61}.navOrb svg{width:34px;height:34px;stroke-width:2.6;filter:drop-shadow(0 0 6px #e2b6ff) drop-shadow(0 0 12px #873cff)}.nav .active{color:#c979ff}
.hero{padding:14px;margin:0 0 14px;display:flex;align-items:center;gap:12px}.heroIcon{width:66px;height:66px;min-width:66px;border-radius:20px;display:grid;place-items:center;background:#13081f;border:1px solid #7d32ff88;box-shadow:0 0 18px #873cff66}.heroIcon svg{width:40px;height:40px;stroke-width:2.7}.hero h2{margin:0 0 4px;font-size:20px}.hero p{margin:0;color:#cbb8ea;font-size:13px}.heroActions{margin-left:auto;display:grid;gap:8px;min-width:102px}.tools{display:grid;grid-template-columns:1fr 118px;gap:9px;margin:10px 0 14px}.tools input,.tools select,.inp{min-width:0;background:#100b19;border:1px solid #6b2fb3;color:white;border-radius:16px;padding:13px;outline:none}.albums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}.album{min-height:154px;border-radius:22px;overflow:hidden;position:relative;color:white;text-align:left;padding:0}.cover{height:104px;background:radial-gradient(circle at center,#2b1450,#090713 72%);display:grid;place-items:center}.cover svg{width:46px;height:46px;stroke-width:2.7}.meta{position:absolute;left:0;right:0;bottom:0;padding:35px 12px 10px;background:linear-gradient(transparent,#000f)}.meta h3{margin:0 0 3px;font-size:17px}.meta p{margin:0;color:#ddd;font-size:12px}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.thumb{aspect-ratio:1;border-radius:15px;overflow:hidden;border:1px solid #4b2574;background:#05030b;display:grid;place-items:center;position:relative}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.play{position:absolute;width:42px;height:42px;border-radius:50%;background:#0009;display:grid;place-items:center;border:1px solid #fff5}.mname{font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mm{font-size:10px;color:#cbb8ea}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:18px;color:white;text-align:left}.av{width:48px;height:48px;border-radius:16px;background:linear-gradient(180deg,#a75bff,#6620ed);display:grid;place-items:center;font-weight:900;box-shadow:0 0 15px #873cff66}.row strong{display:block}.row small{display:block;color:#cbb8ea;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{width:100%;min-height:260px;border-radius:18px;background:#10101a;border:1px solid #35204d;color:white;padding:16px;resize:vertical}.browserFrame{min-height:360px;border-radius:20px;padding:20px;text-align:center}.google{font-size:44px;font-weight:850;margin:28px 0 20px}.pill{background:#20202b;border-radius:24px;padding:15px;text-align:left;color:#aaa}.calc{padding-top:28px}.calcTitle{text-align:center;font-weight:800;font-size:22px;margin-bottom:15px;color:#ded7e9}.calcDisplay{height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px;overflow:hidden}.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calcGrid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:#fff;font-size:24px;font-weight:700}.calcGrid .op{background:#33234b;color:#c79bff}.calcGrid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}
@media(max-width:390px){.page{padding-left:20px;padding-right:20px}.grid{gap:11px}.card{height:146px;padding-top:18px}.orb{width:76px;height:76px}.orb svg{width:47px;height:47px}.card span{font-size:20px}.card small{font-size:12.2px}.nav{height:88px}.navOrb{width:54px;height:54px}.tools{grid-template-columns:1fr 105px}}
</style></head><body><main id="app"></main><script>
const app=document.getElementById('app'),STORE='ghost_phoenix_clean_v01';let state={photos:[],videos:[],files:[],notes:[],contacts:[],album:'Library',query:'',sort:'newest'};try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){};const save=()=>localStorage.setItem(STORE,JSON.stringify(state)),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),bytes=n=>(n=Number(n)||0,n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB');
const icons={photo:'<svg viewBox="0 0 64 64"><rect x="10" y="15" width="44" height="34" rx="8"/><circle cx="24" cy="27" r="4.8"/><path d="M16 45l13-12 8 7 5-5 8 10"/></svg>',video:'<svg viewBox="0 0 64 64"><rect x="10" y="17" width="34" height="30" rx="8"/><path d="M44 27l11-7v24l-11-7z"/></svg>',files:'<svg viewBox="0 0 64 64"><path d="M11 20h18l6 7h18v23H11z"/><path d="M11 27h42"/></svg>',notes:'<svg viewBox="0 0 64 64"><rect x="17" y="10" width="30" height="44" rx="6"/><path d="M25 23h14M25 32h14M25 41h9"/><path d="M41 10v9h6"/></svg>',browser:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22"/><path d="M10 32h44M32 10c7 8 7 36 0 44M32 10c-7 8-7 36 0 44"/></svg>',home:'<svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z"/></svg>',hide:'<svg viewBox="0 0 64 64"><path d="M7 32s9-15 25-15 25 15 25 15-9 15-25 15S7 32 7 32z"/><path d="M17 50L50 14"/></svg>'};
function nav(a){return '<div class="nav"><button class="'+(a==='home'?'active':'')+'" onclick="dashboard()"><span class="navOrb">'+icons.home+'</span>Home</button><div class="line"></div><button class="'+(a==='hide'?'active':'')+'" onclick="calculator()"><span class="navOrb">'+icons.hide+'</span>Hide</button></div>'}
function top(t,s){return '<div class="top"><button class="ib" onclick="dashboard()">←</button><div><h1>'+t+'</h1><p>'+s+'</p></div><button class="ib" onclick="calculator()">◌</button></div>'}
function dashboard(){app.innerHTML='<section class="page"><div class="grid">'+dash('Photo Vault','Pictures & albums',icons.photo,'mediaVault("photos")')+dash('Video Vault','Clips & private videos',icons.video,'mediaVault("videos")')+dash('Files Vault','Documents & folders',icons.files,'filesPage()')+dash('Notes Vault','Private notes',icons.notes,'notesPage()')+dash('Browser','Secure search',icons.browser,'browserPage()')+'<button class="card" onclick="contactsPage()"><span class="orb"><span class="ghost"></span></span><span>Contacts</span><small>Private chats</small></button></div>'+nav('home')+'</section>'}
function dash(t,s,i,fn){return '<button class="card" onclick=\''+fn+'\'><span class="orb">'+i+'</span><span>'+t+'</span><small>'+s+'</small></button>'}
function mediaVault(type){state.album='Library';state.query='';save();renderMedia(type)}function albums(type){let b=['Library','Favourites','Family','Private'];state[type].forEach(x=>{if(x.album&&!b.includes(x.album))b.push(x.album)});return b}function items(type,a=state.album){let arr=state[type].map((x,i)=>({...x,i}));if(a==='Library')arr=arr.filter(x=>x.album!=='Private');else if(a==='Favourites')arr=arr.filter(x=>x.fav&&x.album!=='Private');else arr=arr.filter(x=>(x.album||'Family')===a);if(state.query)arr=arr.filter(x=>x.name.toLowerCase().includes(state.query.toLowerCase()));arr.sort((a,b)=>state.sort==='az'?a.name.localeCompare(b.name):state.sort==='za'?b.name.localeCompare(a.name):state.sort==='oldest'?a.created-b.created:b.created-a.created);return arr}
function renderMedia(type){let label=type==='photos'?'photo':'video',icon=type==='photos'?icons.photo:icons.video,its=items(type);app.innerHTML='<section class="page">'+top(type==='photos'?'Photo Vault':'Video Vault',its.length+' '+label+(its.length===1?'':'s'))+'<div class="hero panel"><div class="heroIcon">'+icon+'</div><div><h2>'+(type==='photos'?'Photo Vault':'Video Vault')+'</h2><p>Clean albums, favourites and private.</p></div><div class="heroActions"><label class="primary">Upload<input type="file" '+(type==='photos'?'accept="image/*"':'accept="video/*"')+' multiple hidden onchange="uploadMedia(\\''+type+'\\',this.files)"></label><button class="secondary" onclick="newAlbum(\\''+type+'\\')">+ Album</button></div></div><div class="tools"><input placeholder="Search..." value="'+esc(state.query)+'" oninput="state.query=this.value;save();renderMedia(\\''+type+'\\')"><select onchange="state.sort=this.value;save();renderMedia(\\''+type+'\\')"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="az">A-Z</option><option value="za">Z-A</option></select></div>'+(state.album==='Library'?albumGrid(type):mediaGrid(type,its))+nav('home')+'</section>';let sel=document.querySelector('select');if(sel)sel.value=state.sort}
function albumGrid(type){return '<div class="albums">'+albums(type).map(a=>'<button class="album panel" onclick="state.album=\\''+a+'\\';state.query=\\'\\';save();renderMedia(\\''+type+'\\')"><div class="cover">'+(a==='Private'?icons.hide:(type==='photos'?icons.photo:icons.video))+'</div><div class="meta"><h3>'+a+'</h3><p>'+items(type,a).length+' items</p></div></button>').join('')+'</div>'}
function mediaGrid(type,arr){return arr.length?'<div class="media">'+arr.map(x=>'<div onclick="openMedia(\\''+type+'\\','+x.i+')"><div class="thumb">'+(type==='photos'?'<img src="'+x.data+'">':'<video src="'+x.data+'"></video><span class="play">▶</span>')+'</div><div class="mname">'+esc(x.name)+'</div><div class="mm">'+bytes(x.size)+'</div></div>').join('')+'</div>':'<div class="empty"><b>👻</b>No items here yet</div>'}
function uploadMedia(type,files){[...files].forEach(file=>{let r=new FileReader();r.onload=()=>{state[type].push({name:file.name,size:file.size,data:r.result,album:state.album==='Library'?'Family':state.album,created:Date.now(),fav:false});save();renderMedia(type)};r.readAsDataURL(file)})}
function openMedia(type,i){let x=state[type][i],priv=x.album==='Private',body=type==='photos'?'<img style="width:100%;max-height:72vh;object-fit:contain;border-radius:18px" src="'+x.data+'">':'<video controls playsinline style="width:100%;max-height:72vh;border-radius:18px;background:#000" src="'+x.data+'"></video>';app.innerHTML='<section class="page">'+top(esc(x.name),x.album)+'<div class="panel" style="padding:12px">'+body+'</div><div class="list" style="margin-top:12px">'+(!priv?'<button class="secondary" onclick="toggleFav(\\''+type+'\\','+i+')">'+(x.fav?'★ Remove Favourite':'☆ Add Favourite')+'</button>':'')+'<button class="secondary" onclick="renameItem(\\''+type+'\\','+i+')">Rename</button><button class="secondary" onclick="moveItem(\\''+type+'\\','+i+')">Move</button><button class="secondary danger" onclick="deleteItem(\\''+type+'\\','+i+')">Delete</button></div>'+nav('home')+'</section>'}
function toggleFav(t,i){state[t][i].fav=!state[t][i].fav;save();openMedia(t,i)}function renameItem(t,i){let v=prompt('New name',state[t][i].name);if(v){state[t][i].name=v;save();openMedia(t,i)}}function moveItem(t,i){let a=prompt('Move to album',state[t][i].album||'Family');if(a){if(state[t][i].album==='Private'&&a!=='Private'&&!confirm('Moving out of Private means it will no longer be hidden. Continue?'))return;state[t][i].album=a;if(a==='Private')state[t][i].fav=false;save();renderMedia(t)}}function deleteItem(t,i){if(confirm('Delete item?')){state[t].splice(i,1);save();renderMedia(t)}}function newAlbum(t){let a=prompt('Album name');if(a){state.album=a;save();renderMedia(t)}}
function filesPage(){app.innerHTML='<section class="page">'+top('Files Vault',state.files.length+' files')+'<div class="hero panel"><div class="heroIcon">'+icons.files+'</div><div><h2>Files Vault</h2><p>Documents and private files.</p></div><label class="primary heroActions">Upload<input type="file" multiple hidden onchange="uploadFiles(this.files)"></label></div><div class="list">'+(state.files.length?state.files.map((f,i)=>row('📁',f.name,bytes(f.size),'delFile('+i+')')).join(''):'<div class="empty"><b>📁</b>No files yet</div>')+'</div>'+nav('home')+'</section>'}function uploadFiles(files){[...files].forEach(file=>state.files.push({name:file.name,size:file.size,created:Date.now()}));save();filesPage()}function delFile(i){if(confirm('Delete file?')){state.files.splice(i,1);save();filesPage()}}
function notesPage(){app.innerHTML='<section class="page">'+top('Notes Vault',state.notes.length+' notes')+'<button class="primary" onclick="editNote()">+ New Note</button><div class="list" style="margin-top:12px">'+(state.notes.length?state.notes.map((n,i)=>row('📝',n.title,n.text.slice(0,40),'editNote('+i+')')).join(''):'<div class="empty"><b>📝</b>No notes yet</div>')+'</div>'+nav('home')+'</section>'}function editNote(i){let n=i>=0?state.notes[i]:{title:'New Note',text:''};app.innerHTML='<section class="page">'+top('Edit Note','Private note')+'<input class="inp" id="nt" value="'+esc(n.title)+'"><textarea class="note" id="nx">'+esc(n.text)+'</textarea><div class="list" style="margin-top:12px"><button class="primary" onclick="saveNote('+i+')">Save</button>'+(i>=0?'<button class="secondary danger" onclick="delNote('+i+')">Delete</button>':'')+'</div>'+nav('home')+'</section>'}function saveNote(i){let n={title:nt.value||'Untitled',text:nx.value,created:Date.now()};if(i>=0)state.notes[i]=n;else state.notes.push(n);save();notesPage()}function delNote(i){if(confirm('Delete note?')){state.notes.splice(i,1);save();notesPage()}}
function browserPage(){app.innerHTML='<section class="page">'+top('Browser','Secure search shell')+'<div class="browserFrame panel"><div class="google">Ghost</div><div class="pill">Search privately...</div><p style="color:#cbb8ea">Browser engine shell ready.</p></div>'+nav('home')+'</section>'}
function contactsPage(){app.innerHTML='<section class="page">'+top('Contacts',state.contacts.length+' contacts')+'<button class="primary" onclick="addContact()">+ Contact</button><div class="list" style="margin-top:12px">'+(state.contacts.length?state.contacts.map((c,i)=>row(c.name[0]||'G',c.name,c.last||'No messages yet','chat('+i+')')).join(''):'<div class="empty"><b>👻</b>No contacts yet</div>')+'</div>'+nav('home')+'</section>'}function addContact(){let n=prompt('Contact name');if(n){state.contacts.push({name:n,messages:[],last:''});save();contactsPage()}}function chat(i){let c=state.contacts[i];app.innerHTML='<section class="page">'+top(esc(c.name),'Private chat')+'<div class="list">'+(c.messages||[]).map(m=>'<div class="panel" style="padding:12px;text-align:'+(m.me?'right':'left')+'">'+esc(m.text)+'</div>').join('')+'</div><div style="position:fixed;left:50%;transform:translateX(-50%);bottom:110px;width:min(386px,calc(100vw - 32px));display:grid;grid-template-columns:1fr 50px;gap:8px"><input class="inp" id="msg" placeholder="Message"><button class="primary" onclick="sendMsg('+i+')">➤</button></div>'+nav('home')+'</section>'}function sendMsg(i){if(!msg.value.trim())return;state.contacts[i].messages.push({me:true,text:msg.value,created:Date.now()});state.contacts[i].last=msg.value;save();chat(i)}
function row(icon,t,s,fn){return '<button class="row panel" onclick="'+fn+'"><div class="av">'+icon+'</div><div><strong>'+esc(t)+'</strong><small>'+esc(s)+'</small></div><span>›</span></button>'}
function calculator(){app.innerHTML='<section class="page calc"><div class="calcTitle">Calculator</div><div id="display" class="calcDisplay">0</div><div class="calcGrid">'+["C","±","%","÷","7","8","9","×","4","5","6","-","1","2","3","+","0",".","⌫","="].map(k=>'<button class="'+(["÷","×","-","+","="].includes(k)?"op":"")+' '+(k==="="?"eq":"")+'" onclick="press(\\''+k+'\\')">'+k+'</button>').join('')+'</div>'+nav('hide')+'</section>'}let calc='0';function press(k){if(k==='C')calc='0';else if(k==='⌫')calc=calc.length>1?calc.slice(0,-1):'0';else if(k==='='){try{calc=String(Function('return '+calc.replaceAll('×','*').replaceAll('÷','/'))())}catch(e){calc='Error'}}else if(k==='±'){if(calc!=='0'&&calc!=='Error')calc=calc.startsWith('-')?calc.slice(1):'-'+calc}else calc=(calc==='0'||calc==='Error')?k:calc+k;let d=document.getElementById('display');if(d)d.textContent=calc}
dashboard();
</script></body></html>
