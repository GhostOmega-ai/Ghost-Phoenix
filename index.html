<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10051f">
<title>Ghost Phoenix v0.2</title>
<style>
:root{--bg:#05030b;--panel:#11101c;--line:#5b2790;--purple:#873cff;--purple2:#a75bff;--text:#fff;--muted:#aaa2b7;--danger:#ff514f}
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e0b3c 0,#07030d 35%,#020204 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}button,input,select{font:inherit}.phone{max-width:430px;min-height:100vh;margin:0 auto;padding:18px 22px 104px;position:relative}.status{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:10px}.screen{animation:fade .16s}@keyframes fade{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}
.vaultMiniLogo{position:absolute;left:28px;top:70px;width:38px;height:38px;border-radius:12px;background:#05030b;border:1px solid #873cff88;box-shadow:0 0 16px #873cff88;display:grid;place-items:center;font-size:23px}.vaultClose{position:absolute;right:25px;top:78px;background:transparent;border:0;color:#a95cff;font-size:36px}.targetHero{display:grid;place-items:center;text-align:center;margin:-8px auto 14px}.bigGhost{width:min(190px,56vw);aspect-ratio:1.25;border-radius:28px;background:radial-gradient(circle at 50% 40%,#b982ff 0,#873cff 38%,#25103f 78%,#05030b 100%);border:1px solid #873cff88;box-shadow:0 0 20px #873cff88,0 0 44px #873cff44;display:grid;place-items:center;font-size:78px;margin-bottom:-10px}.targetTitle{margin:0;font-size:38px;line-height:.88;font-weight:300;letter-spacing:10px;color:transparent;background:linear-gradient(180deg,#fff3ff 0%,#c678ff 47%,#7a2cff 100%);-webkit-background-clip:text;background-clip:text}.targetSub{margin-top:9px;font-size:10.5px;letter-spacing:4.6px;color:#bd6dff}.dashboardGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.vaultBtn{min-height:112px;padding:14px 6px 11px;border-radius:19px;border:1px solid #642ba599;background:linear-gradient(180deg,rgba(10,8,18,.92),rgba(3,3,8,.98));box-shadow:inset 0 0 0 1px #ffffff06,0 7px 16px #0008;text-align:center;color:#fff}.vaultBtn .big{width:48px;height:48px;margin:0 auto 7px;display:grid;place-items:center;font-size:32px;color:#b87aff;filter:drop-shadow(0 0 8px #873cff)}.vaultBtn span{display:block;font-size:18px;font-weight:360}.vaultBtn small{display:block;font-size:11px;color:#c8bfd7;margin-top:3px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));z-index:999;padding:9px 10px 8px;border-radius:28px;background:rgba(5,4,12,.88);border:1px solid #5b279088;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;backdrop-filter:blur(12px)}.nav button{font-size:12px;color:#ded7e9;display:grid;gap:2px;background:transparent;border:0;text-align:center}.nav .nI{height:28px;display:grid;place-items:center;font-size:23px}.topRow{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;margin:8px 0 14px}.iconBtn{height:52px;border-radius:17px;border:1px solid #642ba5;background:#100b19;color:white;font-size:24px;box-shadow:0 0 12px #873cff22}.titleBlock h2{margin:0;font-size:30px;line-height:1}.titleBlock p{margin:6px 0 0;color:var(--muted);font-size:14px}.vBadge{display:inline-grid;place-items:center;border:1px solid #873cff88;border-radius:999px;padding:4px 8px;color:#d8b6ff;font-size:10px;margin-left:6px;vertical-align:middle}
.heroCard{border:1px solid #552681;background:linear-gradient(145deg,#181229,#090713);border-radius:24px;padding:14px;margin:4px 0 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px #0005}.heroIcon{width:66px;height:66px;min-width:66px;border-radius:20px;background:#05030b;border:1px solid #7d32ff66;box-shadow:0 0 18px #873cff66;display:grid;place-items:center;font-size:34px}.heroCard h3{margin:0 0 4px;font-size:20px}.heroCard p{margin:0;color:var(--muted);font-size:13px}.heroActions{margin-left:auto;display:grid;gap:8px;min-width:98px}.heroActions button,.heroActions label{min-height:45px;border-radius:15px;border:0;background:linear-gradient(180deg,#a75bff,#6620ed);color:white;font-weight:900;display:grid;place-items:center;box-shadow:0 0 15px #873cff77;padding:0 12px}
.stats{border:1px solid #552681;background:linear-gradient(145deg,#181229,#090713);border-radius:20px;padding:12px;margin:8px 0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;box-shadow:0 8px 24px #0005}.stats b{display:block;font-size:17px}.stats span{display:block;color:#aaa2b7;font-size:11px;margin-top:3px}.tools{display:grid;grid-template-columns:1fr 126px;gap:9px;margin:10px 0 16px;position:relative}.tools input,.tools select{min-width:0;background:#100b19;border:1px solid #6b2fb3;color:white;border-radius:16px;padding:13px;outline:none;font-size:15px;box-shadow:inset 0 0 12px #873cff22}.clearSearch{position:absolute;right:136px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#b875ff;font-size:20px;z-index:3}
.albumGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}.albumCard{position:relative;min-height:160px;border:1px solid #4b2574;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#181229,#090713);box-shadow:0 10px 30px #0006;text-align:left;color:white;padding:0}.albumCard.privateCard{border-color:#873cffaa;box-shadow:0 0 18px #873cff33,0 10px 30px #0006}.albumCover{height:112px;background:#05030b;display:grid;place-items:center;position:relative;overflow:hidden}.albumCover img{width:100%;height:100%;object-fit:cover}.albumCover span{font-size:42px;filter:drop-shadow(0 0 12px #873cff)}.albumMeta{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.96));z-index:2}.albumMeta h3{margin:0 0 3px;font-size:17px}.albumMeta p{margin:0;color:#ddd;font-size:12px}
.mediaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.mediaTile{position:relative;min-width:0;color:white}.mediaThumb{aspect-ratio:1.05;border:1px solid #4b2574;border-radius:16px;background:radial-gradient(circle at center,#25103f,#05030b 72%);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 20px #0006}.mediaThumb img,.mediaThumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mediaThumb video{opacity:.88}.playBubble{position:relative;z-index:2;width:46px;height:46px;border-radius:999px;background:#000a;border:1px solid #ffffff55;display:grid;place-items:center;box-shadow:0 0 14px #873cff88}.privateBadge{position:absolute;top:7px;left:7px;z-index:7;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;color:#f1dcff;background:#090611cc;border:1px solid #873cff99}.mediaName{font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mediaMeta{font-size:11px;color:var(--muted);margin-top:2px}.mediaTile.selected .mediaThumb{outline:3px solid #a75bff;filter:brightness(.78);box-shadow:0 0 18px #873cff99}.tick{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:999px;background:#a75bff;display:grid;place-items:center;font-weight:900;z-index:7;box-shadow:0 0 12px #873cff}.selectBar{position:sticky;top:0;z-index:40;background:#090611f2;border:1px solid #4b2574;border-radius:20px;padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:8px}.selectBar strong{flex:1}.selectBar button{border:0;background:#171126;color:white;border-radius:13px;padding:10px 12px;font-weight:800}.selectBar .danger{background:var(--danger)}.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty .big{font-size:56px;margin-bottom:10px}
.sheetBack{position:fixed;inset:0;background:#000c;z-index:1200;display:grid;align-items:end;padding:16px}.sheet{background:linear-gradient(145deg,#151020,#05030b);border:1px solid #873cff;border-radius:24px;padding:14px;box-shadow:0 0 34px #873cff66,inset 0 0 18px #873cff14}.sheet h2{margin:0 42px 4px 0;font-size:20px}.sheet p{margin:0 42px 12px 0;color:var(--muted);font-size:13px}.sheet button{display:block;width:100%;background:#11101c;border:1px solid #2d174a;color:white;text-align:left;padding:14px 16px;font-weight:800;border-radius:15px;margin:7px 0}.sheet .primary{text-align:center;background:linear-gradient(180deg,#a75bff,#6620ed);border:0}.sheet .danger{color:#ff6868;border-color:#5a1d34}.closeSheet{position:absolute;right:30px;margin-top:-2px;width:34px!important;height:34px;border-radius:999px!important;padding:0!important;text-align:center!important}.infoGrid{display:grid;gap:8px;margin:10px 0}.infoRow{display:grid;grid-template-columns:94px 1fr;gap:10px;padding:10px;border-radius:14px;background:#0b0713;border:1px solid #2d174a;color:#ddd;font-size:13px}.infoRow strong{color:#b875ff}
.player{position:fixed;inset:0;background:#020204f4;z-index:1100;padding:18px;display:flex;flex-direction:column}.playerTop{display:grid;grid-template-columns:52px 1fr 52px 52px;gap:10px;align-items:center;margin-bottom:14px}.playerTop button{height:52px;border-radius:17px;border:1px solid #642ba5;background:#100b19;color:white;font-size:25px}.playerTop strong{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}.player video,.player img{width:100%;max-height:76vh;margin:auto 0;border-radius:20px;background:#000;box-shadow:0 0 25px #873cff66;object-fit:contain}.flash{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#100b19;border:1px solid #873cff;color:white;border-radius:999px;padding:10px 14px;z-index:5000;box-shadow:0 0 18px #873cff88;font-weight:800}
@media(max-width:390px){.phone{padding:16px 20px 104px}.tools{grid-template-columns:1fr 108px}.clearSearch{right:118px}.heroActions{min-width:88px}.selectBar{overflow:auto}}
</style>
</head>
<body>
<main id="app" class="phone"></main>
<script>
const app=document.getElementById("app");
const GhostState={build:"Ghost Phoenix v0.2",activeVault:"dashboard",media:{photos:[],videos:[]},ui:{album:"Library",search:"",sort:"newest",selected:[]}};
const STORAGE_KEY="ghost_phoenix_v02";
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(GhostState))}catch(e){}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const saved=JSON.parse(raw);if(saved.media)GhostState.media=saved.media;if(saved.ui)GhostState.ui={...GhostState.ui,...saved.ui,selected:[]}}catch(e){}}
function flash(m){const old=document.querySelector(".flash");if(old)old.remove();const el=document.createElement("div");el.className="flash";el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),1600)}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
const MediaEngine=(()=>{const base=["Library","Favourites","Family","Private"];function items(t){return GhostState.media[t]||[]}function isPrivate(x){return String(x?.album||"").toLowerCase()==="private"}function normalise(t){items(t).forEach(x=>{if(!x.album)x.album="Family";if(!x.created)x.created=Date.now();if(isPrivate(x))x.fav=false})}function albums(t){normalise(t);const r=[...base];items(t).forEach(x=>{if(x.album&&!r.includes(x.album))r.push(x.album)});return r}function name(x){return x?.name||x?.fileName||"Untitled"}function date(x){return Number(x?.created||x?.date||0)}function indexes(t,a=GhostState.ui.album){normalise(t);const arr=items(t);let idx=[];if(a==="Library")idx=arr.map((x,i)=>isPrivate(x)?-1:i).filter(i=>i>=0);else if(a==="Favourites")idx=arr.map((x,i)=>(x.fav&&!isPrivate(x))?i:-1).filter(i=>i>=0);else idx=arr.map((x,i)=>(x.album||"Family")===a?i:-1).filter(i=>i>=0);const q=String(GhostState.ui.search||"").toLowerCase().trim();if(q)idx=idx.filter(i=>name(arr[i]).toLowerCase().includes(q));const s=GhostState.ui.sort||"newest";idx.sort((a,b)=>{const A=arr[a],B=arr[b];if(s==="oldest")return date(A)-date(B);if(s==="az")return name(A).localeCompare(name(B));if(s==="za")return name(B).localeCompare(name(A));return date(B)-date(A)});return idx}function cover(t,a){if(a==="Private")return"";const arr=items(t);const f=indexes(t,a).find(i=>arr[i]?.thumb||arr[i]?.url);return f===undefined?"":(arr[f].thumb||arr[f].url)}function count(t,a){return indexes(t,a).length}function setAlbum(a){GhostState.ui.album=a;GhostState.ui.search="";GhostState.ui.selected=[];saveState()}function toggleSelect(i){const s=GhostState.ui.selected,p=s.indexOf(i);p>=0?s.splice(p,1):s.push(i)}function clearSelect(){GhostState.ui.selected=[]}function toggleFavourite(t,i){const x=items(t)[i];if(!x)return;if(isPrivate(x)){x.fav=false;flash("Private items stay private");saveState();return}x.fav=!x.fav;flash(x.fav?"Favourite added":"Favourite removed");saveState()}function move(t,idx,a){const arr=items(t);const leaving=idx.some(i=>isPrivate(arr[i]))&&a!=="Private";if(leaving&&!confirm("Moving out of Private means it will no longer be hidden. Continue?"))return false;idx.forEach(i=>{const x=arr[i];if(x){x.album=a;if(a==="Private")x.fav=false}});clearSelect();saveState();flash(a==="Private"?"Moved to Private":"Moved");return true}function rename(t,i){const x=items(t)[i];if(!x)return;const v=prompt("New name",name(x));if(v&&v.trim()){x.name=v.trim();saveState();flash("Renamed")}}function remove(t,idx){if(!confirm(`Delete selected ${idx.length===1?"item":"items"}?`))return false;GhostState.media[t]=items(t).filter((_,i)=>!idx.includes(i));clearSelect();saveState();flash("Deleted");return true}function addFiles(t,list){const files=[...list||[]];files.forEach(file=>{const url=URL.createObjectURL(file);items(t).push({id:String(Date.now()+Math.random()),type:t,name:file.name,album:GhostState.ui.album==="Library"?"Family":GhostState.ui.album,url,thumb:t==="photos"?url:"",size:file.size,created:Date.now(),fav:false})});saveState();flash(`${files.length} added`)}function bytes(n){n=Number(n)||0;if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(1)+" MB"}return{items,isPrivate,albums,indexes,cover,count,setAlbum,toggleSelect,clearSelect,toggleFavourite,move,rename,remove,addFiles,bytes,name}})();
function nav(){return`<div class="nav"><button onclick="renderDashboard()"><span class="nI">⌂</span>Home</button><button onclick="hideApp()"><span class="nI">◌</span>Hide</button></div>`}
function hideApp(){document.body.innerHTML=""}
function renderDashboard(){GhostState.activeVault="dashboard";GhostState.ui.album="Library";GhostState.ui.search="";GhostState.ui.selected=[];saveState();app.innerHTML=`<section class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮⌁▭</span></div><div class="vaultMiniLogo">👻</div><button class="vaultClose" onclick="hideApp()">×</button><div class="targetHero"><div class="bigGhost">👻</div><h1 class="targetTitle">GHOST</h1><div class="targetSub">PHOENIX v0.2</div></div><div class="dashboardGrid"><button class="vaultBtn" onclick="openPhotoVault()"><span class="big">🖼️</span><span>Photo Vault</span><small>Clean media engine</small></button><button class="vaultBtn" onclick="openVideoVault()"><span class="big">▶</span><span>Video Vault</span><small>Ultimate foundation</small></button><button class="vaultBtn" onclick="placeholder('Files Vault')"><span class="big">📁</span><span>Files Vault</span><small>Coming soon</small></button><button class="vaultBtn" onclick="placeholder('Notes Vault')"><span class="big">📝</span><span>Notes Vault</span><small>Coming soon</small></button><button class="vaultBtn" onclick="placeholder('Browser')"><span class="big">🌐</span><span>Browser</span><small>Coming soon</small></button><button class="vaultBtn" onclick="placeholder('Contacts')"><span class="big">👤</span><span>Contacts</span><small>Coming soon</small></button></div>${nav()}</section>`}
function placeholder(t){app.innerHTML=`<section class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮⌁▭</span></div><div class="topRow"><button class="iconBtn" onclick="renderDashboard()">←</button><div class="titleBlock"><h2>${esc(t)}</h2><p>Coming next in Phoenix</p></div><span></span></div><div class="heroCard"><div class="heroIcon">👻</div><div><h3>${esc(t)}</h3><p>This module will be rebuilt cleanly after the Media Engine.</p></div></div>${nav()}</section>`}
function openPhotoVault(){openVault("photos")}function openVideoVault(){openVault("videos")}
function configFor(t){return t==="videos"?{type:"videos",title:"Video Vault",subtitle:"Ultimate foundation: albums, search, sort, private rules.",label:"video",hero:"▶",albumIcon:"▶",empty:"🎬",accept:"video/*"}:{type:"photos",title:"Photo Vault",subtitle:"Private pictures, albums and favourites.",label:"photo",hero:"🖼️",albumIcon:"🖼️",empty:"👻",accept:"image/*"}}
function stats(c){const total=MediaEngine.items(c.type).length,vis=MediaEngine.indexes(c.type).length,size=MediaEngine.bytes(MediaEngine.indexes(c.type).reduce((s,i)=>s+Number(MediaEngine.items(c.type)[i]?.size||0),0));return`<div class="stats"><div><b>${total}</b><span>Total</span></div><div><b>${vis}</b><span>Visible</span></div><div><b>${size}</b><span>Storage</span></div></div>`}
function openVault(t,keep=false){GhostState.activeVault=t;renderMediaVault(configFor(t));if(keep)setTimeout(()=>{const s=document.getElementById("mediaSearch");if(s){const e=s.value.length;s.focus();try{s.setSelectionRange(e,e)}catch(x){}}},20)}
function renderMediaVault(c){const t=c.type,a=GhostState.ui.album,idx=MediaEngine.indexes(t),sel=GhostState.ui.selected;app.innerHTML=`<section class="screen"><div class="status"><span>9:41</span><span class="icons">▮▮▮⌁▭</span></div><div class="topRow"><button class="iconBtn" onclick="${a==="Library"?"renderDashboard()":"openVault('"+t+"')"}">←</button><div class="titleBlock"><h2>${esc(a)} ${t==="videos"&&a==="Library"?`<span class="vBadge">v0.2</span>`:""}</h2><p>${idx.length} ${c.label}${idx.length===1?"":"s"}</p></div><button class="iconBtn" onclick="createAlbum('${t}')">•••</button></div>${sel.length?`<div class="selectBar"><strong>${sel.length} selected</strong><button onclick="openMoveSheet('${t}')">Move</button>${a==="Private"?"":`<button onclick="multiFavourite('${t}')">Favourite</button>`}<button class="danger" onclick="deleteSelected('${t}')">Delete</button><button onclick="MediaEngine.clearSelect();openVault('${t}')">Cancel</button></div>`:""}${stats(c)}<div class="tools"><input id="mediaSearch" placeholder="Search ${c.label}s..." value="${esc(GhostState.ui.search||"")}" oninput="GhostState.ui.search=this.value;openVault('${t}',true)">${GhostState.ui.search?`<button class="clearSearch" onclick="GhostState.ui.search='';openVault('${t}',true)">×</button>`:""}<select onchange="GhostState.ui.sort=this.value;openVault('${t}',true)"><option value="newest" ${GhostState.ui.sort==="newest"?"selected":""}>Newest</option><option value="oldest" ${GhostState.ui.sort==="oldest"?"selected":""}>Oldest</option><option value="az" ${GhostState.ui.sort==="az"?"selected":""}>A-Z</option><option value="za" ${GhostState.ui.sort==="za"?"selected":""}>Z-A</option></select></div>${a==="Library"?mediaHome(c):mediaGrid(c,idx)}${nav()}</section>`}
function mediaHome(c){return`<div class="heroCard"><div class="heroIcon">${c.hero}</div><div><h3>${esc(c.title)}</h3><p>${esc(c.subtitle)}</p></div><div class="heroActions"><label>Upload<input type="file" accept="${c.accept}" multiple hidden onchange="uploadMedia('${c.type}',this.files)"></label><button onclick="createAlbum('${c.type}')">+ Album</button></div></div><div class="albumGrid">${MediaEngine.albums(c.type).map(a=>{const cover=MediaEngine.cover(c.type,a),sym=a==="Favourites"?"☆":a==="Private"?"🔒":c.albumIcon;return`<button class="albumCard ${a==="Private"?"privateCard":""}" onclick="MediaEngine.setAlbum('${esc(a)}');openVault('${c.type}')"><div class="albumCover">${cover?`<img src="${cover}" alt="">`:`<span>${sym}</span>`}</div><div class="albumMeta"><h3>${esc(a)}</h3><p>${MediaEngine.count(c.type,a)} ${c.label}${MediaEngine.count(c.type,a)===1?"":"s"}</p></div></button>`}).join("")}</div>`}
function mediaGrid(c,idx){if(!idx.length)return`<div class="empty"><div class="big">${c.empty}</div><h3>No ${c.label}s found</h3><p>Upload or move items into this album.</p></div>`;return`<div class="mediaGrid">${idx.map(i=>mediaTile(c,i)).join("")}</div>`}
let holdTimer=null,didHold=false;function mediaTile(c,i){const x=MediaEngine.items(c.type)[i],s=GhostState.ui.selected.includes(i),p=MediaEngine.isPrivate(x);return`<div class="mediaTile ${s?"selected":""}" onpointerdown="startHold(event,'${c.type}',${i})" onpointerup="endHold(event,'${c.type}',${i})" onpointercancel="cancelHold()" onpointermove="cancelHold()" onclick="tapMedia(event,'${c.type}',${i})"><div class="mediaThumb">${c.type==="photos"?`<img src="${x.url}" alt="">`:`<video src="${x.url}" muted playsinline preload="metadata"></video><div class="playBubble">▶</div>`}${s?`<div class="tick">✓</div>`:""}${p?`<div class="privateBadge">PRIVATE</div>`:""}</div><div class="mediaName">${esc(MediaEngine.name(x))}</div><div class="mediaMeta">${MediaEngine.bytes(x.size)}</div></div>`}
function startHold(e,t,i){didHold=false;cancelHold();holdTimer=setTimeout(()=>{didHold=true;MediaEngine.toggleSelect(i);openVault(t)},430)}function cancelHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null}}function endHold(e,t,i){cancelHold();if(didHold){e.preventDefault();e.stopPropagation();setTimeout(()=>didHold=false,40)}}function tapMedia(e,t,i){if(didHold){e.preventDefault();e.stopPropagation();return}if(GhostState.ui.selected.length){MediaEngine.toggleSelect(i);openVault(t)}else openPlayer(t,i)}
function openPlayer(t,i){const x=MediaEngine.items(t)[i],fav=!MediaEngine.isPrivate(x);const m=document.createElement("div");m.className="player";m.innerHTML=`<div class="playerTop"><button onclick="this.closest('.player').remove()">←</button><strong>${esc(MediaEngine.name(x))}</strong>${fav?`<button onclick="MediaEngine.toggleFavourite('${t}',${i});this.closest('.player').remove();openPlayer('${t}',${i})">${x.fav?"★":"☆"}</button>`:`<span></span>`}<button onclick="openItemSheet('${t}',${i})">•••</button></div>${t==="videos"?`<video src="${x.url}" controls playsinline></video>`:`<img src="${x.url}" alt="">`}`;document.body.appendChild(m)}
function openItemSheet(t,i){const x=MediaEngine.items(t)[i],fav=!MediaEngine.isPrivate(x);const b=document.createElement("div");b.className="sheetBack";b.onclick=e=>{if(e.target===b)b.remove()};b.innerHTML=`<div class="sheet" onclick="event.stopPropagation()"><button class="closeSheet" onclick="this.closest('.sheetBack').remove()">×</button><h2>${esc(MediaEngine.name(x))}</h2><p>${esc(x.album||"Family")} • ${MediaEngine.bytes(x.size)}</p><button onclick="MediaEngine.rename('${t}',${i});closeSheets();openVault('${t}')">✎ Rename</button><button class="primary" onclick="openMoveSheet('${t}',[${i}])">📁 Move</button><button onclick="infoSheet('${t}',${i})">ⓘ Info</button>${fav?`<button onclick="MediaEngine.toggleFavourite('${t}',${i});closeSheets();openVault('${t}')">${x.fav?"★ Remove Favourite":"☆ Add to Favourites"}</button>`:""}<button class="danger" onclick="MediaEngine.remove('${t}',[${i}]);closeSheets();openVault('${t}')">🗑 Delete</button></div>`;document.body.appendChild(b)}
function infoSheet(t,i){const x=MediaEngine.items(t)[i];closeSheets();const b=document.createElement("div");b.className="sheetBack";b.onclick=e=>{if(e.target===b)b.remove()};const d=x.created?new Date(x.created).toLocaleString():"Unknown";b.innerHTML=`<div class="sheet" onclick="event.stopPropagation()"><button class="closeSheet" onclick="this.closest('.sheetBack').remove()">×</button><h2>Info</h2><p>${esc(MediaEngine.name(x))}</p><div class="infoGrid"><div class="infoRow"><strong>Name</strong><span>${esc(MediaEngine.name(x))}</span></div><div class="infoRow"><strong>Album</strong><span>${esc(x.album||"Family")}</span></div><div class="infoRow"><strong>Size</strong><span>${MediaEngine.bytes(x.size)}</span></div><div class="infoRow"><strong>Added</strong><span>${esc(d)}</span></div><div class="infoRow"><strong>Private</strong><span>${MediaEngine.isPrivate(x)?"Yes":"No"}</span></div><div class="infoRow"><strong>Favourite</strong><span>${x.fav?"Yes":"No"}</span></div></div></div>`;document.body.appendChild(b)}
function openMoveSheet(t,idx){idx=idx||[...GhostState.ui.selected];closeSheets();const b=document.createElement("div");b.className="sheetBack";b.onclick=e=>{if(e.target===b)b.remove()};b.innerHTML=`<div class="sheet" onclick="event.stopPropagation()"><button class="closeSheet" onclick="this.closest('.sheetBack').remove()">×</button><h2>Move ${idx.length===1?"Item":"Items"}</h2><p>Choose where this should live.</p>${MediaEngine.albums(t).filter(a=>a!=="Favourites").map(a=>`<button class="primary" onclick="MediaEngine.move('${t}',[${idx.join(",")}],'${esc(a)}');closeSheets();openVault('${t}')">${esc(a)}</button>`).join("")}</div>`;document.body.appendChild(b)}
function multiFavourite(t){GhostState.ui.selected.forEach(i=>{const x=MediaEngine.items(t)[i];if(x&&!MediaEngine.isPrivate(x))x.fav=true});MediaEngine.clearSelect();saveState();flash("Favourites added");openVault(t)}function deleteSelected(t){MediaEngine.remove(t,[...GhostState.ui.selected]);openVault(t)}function uploadMedia(t,files){MediaEngine.addFiles(t,files);GhostState.ui.sort="newest";openVault(t)}function createAlbum(t){const n=prompt("New album name");if(n&&n.trim()){MediaEngine.setAlbum(n.trim());openVault(t)}}function closeSheets(){document.querySelectorAll(".sheetBack").forEach(x=>x.remove())}
loadState();renderDashboard();
</script>
</body>
</html>
