<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10051f"><title>Ghost Phoenix v0.02</title><style>
:root{--purple:#873cff;--purple2:#b667ff;--muted:#c9b8e8}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#21103d 0,#0b0614 42%,#020204 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button{font:inherit;cursor:pointer}.phone{max-width:430px;min-height:100vh;margin:0 auto;padding:92px 22px 104px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{min-height:138px;padding:16px 8px 13px;border-radius:22px;border:1px solid #6f31aa88;background:linear-gradient(180deg,rgba(16,10,29,.92),rgba(3,3,8,.98));box-shadow:inset 0 0 0 1px #ffffff07,inset 0 0 18px #873cff10,0 9px 20px #0009;text-align:center;color:#fff;overflow:hidden;position:relative}.tile:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,#873cff18,transparent 46%)}.tileIcon,.navIcon{border-radius:999px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 45%,#34105e 0,#140821 58%,#040207 100%);border:1px solid #873cff77;box-shadow:0 0 14px #873cffaa,0 0 30px #873cff55,inset 0 0 18px #873cff33}.tileIcon{width:66px;height:66px;margin:0 auto 9px}.tileIcon:before,.navIcon:before{content:"";position:absolute;inset:-8px;border-radius:999px;background:radial-gradient(circle,#873cff55,transparent 64%);filter:blur(2px)}.tileIcon svg,.navIcon svg{fill:none;stroke:#dcb7ff;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #d59cff) drop-shadow(0 0 10px #873cff);position:relative;z-index:1}.tileIcon svg{width:38px;height:38px;stroke-width:2.7}.tile span{position:relative;z-index:1;display:block;font-size:19px;font-weight:360;text-shadow:0 1px 7px #000}.tile small{position:relative;z-index:1;display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:300}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));z-index:999;padding:10px;border-radius:30px;background:linear-gradient(180deg,rgba(13,7,24,.92),rgba(3,3,8,.96));border:1px solid #782fc088;box-shadow:inset 0 0 18px #873cff14,0 8px 22px #000b,0 0 18px #873cff22;display:grid;grid-template-columns:repeat(2,1fr);overflow:hidden}.nav:before{content:"";position:absolute;top:16px;bottom:16px;left:50%;width:1px;background:#8e55c966}.nav button{background:transparent;border:0;color:#d9c8ed;display:grid;place-items:center;gap:4px;font-size:12px;position:relative;z-index:1}.navIcon{width:54px;height:54px}.navIcon svg{width:30px;height:30px;stroke-width:2.6}.nav button.active .navIcon{border-color:#b667ff;box-shadow:0 0 16px #b667ffcc,0 0 34px #873cff77,inset 0 0 18px #873cff44}.nav button.active{color:#c979ff}.screen{animation:fade .16s ease}@keyframes fade{from{opacity:.7;transform:translateY(4px)}to{opacity:1;transform:none}}.calcPage{padding-top:22px}.calcTitle{text-align:center;font-weight:800;font-size:22px;margin-bottom:15px;color:#ded7e9}.calcDisplay{height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px;overflow:hidden}.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calcGrid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:white;font-size:24px;font-weight:700}.calcGrid .op{background:#33234b;color:#c79bff}.calcGrid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}@media(max-width:390px){.phone{padding:88px 20px 104px}.tile{min-height:128px}.tileIcon{width:58px;height:58px}.tile span{font-size:17px}.navIcon{width:50px;height:50px}}
</style></head><body><main id="app" class="phone"></main><script>
const app=document.getElementById('app');const icons={photo:'<svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="36" rx="8"/><circle cx="24" cy="26" r="5"/><path d="M16 45l13-13 8 8 5-5 8 10"/></svg>',video:'<svg viewBox="0 0 64 64"><rect x="9" y="16" width="36" height="32" rx="8"/><path d="M45 27l12-7v24l-12-7z"/></svg>',files:'<svg viewBox="0 0 64 64"><path d="M11 18h19l6 7h17v25H11z"/><path d="M11 25h42"/></svg>',notes:'<svg viewBox="0 0 64 64"><rect x="15" y="10" width="34" height="44" rx="6"/><path d="M23 24h18M23 33h18M23 42h11"/></svg>',browser:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="23"/><path d="M9 32h46M32 9c8 8 8 38 0 46M32 9c-8 8-8 38 0 46"/></svg>',contacts:'<svg viewBox="0 0 64 64"><path d="M22 42c1-11 19-11 20 0"/><path d="M22 44c-8-5-10-18-2-27 7-8 17-8 24 0 8 9 6 22-2 27"/><circle cx="26" cy="28" r="3"/><circle cx="38" cy="28" r="3"/></svg>',home:'<svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z"/></svg>',hide:'<svg viewBox="0 0 64 64"><path d="M7 32s9-15 25-15 25 15 25 15-9 15-25 15S7 32 7 32z"/><path d="M17 50L50 14"/></svg>'};
function nav(a){return '<div class="nav"><button class="'+(a==='home'?'active':'')+'" onclick="renderDashboard()"><span class="navIcon">'+icons.home+'</span>Home</button><button class="'+(a==='hide'?'active':'')+'" onclick="renderCalculator()"><span class="navIcon">'+icons.hide+'</span>Hide</button></div>'}function tile(n,s,i){return '<button class="tile" onclick="alert(\''+n+' shell coming next\')"><span class="tileIcon">'+i+'</span><span>'+n+'</span><small>'+s+'</small></button>'}function renderDashboard(){app.innerHTML='<section class="screen"><div class="grid">'+tile('Photo Vault','Pictures & albums',icons.photo)+tile('Video Vault','Clips & private videos',icons.video)+tile('Files Vault','Documents & folders',icons.files)+tile('Notes Vault','Private notes',icons.notes)+tile('Browser','Secure search',icons.browser)+tile('Contacts','Private chats',icons.contacts)+'</div>'+nav('home')+'</section>'}function renderCalculator(){app.innerHTML='<section class="screen calcPage"><div class="calcTitle">Calculator</div><div class="calcDisplay" id="calcDisplay">0</div><div class="calcGrid">'+['C','±','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','⌫','='].map(x=>'<button class="'+(['÷','×','-','+','='].includes(x)?'op ':'')+(x==='='?'eq':'')+'" onclick="calcPress(\''+x+'\')">'+x+'</button>').join('')+'</div>'+nav('hide')+'</section>'}let calcValue='0';function calcPress(x){if(x==='C')calcValue='0';else if(x==='⌫')calcValue=calcValue.length>1?calcValue.slice(0,-1):'0';else if(x==='='){try{calcValue=String(Function('return '+calcValue.replaceAll('×','*').replaceAll('÷','/'))())}catch(e){calcValue='Error'}}else{if(calcValue==='0'||calcValue==='Error')calcValue=x;else calcValue+=x}const d=document.getElementById('calcDisplay');if(d)d.textContent=calcValue}renderDashboard();
</script></body></html>
