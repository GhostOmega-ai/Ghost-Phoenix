<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07030d" />
  <title>Ghost Fresh v1.0A Dashboard</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <main class="phone-shell">
    <section id="dashboard" class="screen active" aria-label="Ghost dashboard">
      <header class="dash-header">
        <button class="mini-btn" data-screen="home" aria-label="Home"><img src="assets/icons/home.png" alt="" /></button>
        <img class="brand-logo" src="assets/logo/ghost-logo.png" alt="Ghost Secret Vault" />
        <button class="mini-btn" data-screen="settings" aria-label="Settings"><img src="assets/icons/settings.png" alt="" /></button>
      </header>

      <section class="vault-grid" aria-label="Vault sections">
        <button class="vault-card" data-screen="photos"><img src="assets/icons/photo-vault.png" alt="" /><span>Photo Vault</span><small>Pictures & albums</small></button>
        <button class="vault-card" data-screen="videos"><img src="assets/icons/video-vault.png" alt="" /><span>Video Vault</span><small>Clips & private videos</small></button>
        <button class="vault-card" data-screen="notes"><img src="assets/icons/notes-vault.png" alt="" /><span>Notes Vault</span><small>Private notes</small></button>
        <button class="vault-card" data-screen="files"><img src="assets/icons/files-vault.png" alt="" /><span>Files Vault</span><small>Documents & folders</small></button>
        <button class="vault-card" data-screen="browser"><img src="assets/icons/browser.png" alt="" /><span>Browser</span><small>Secure search</small></button>
        <button class="vault-card" data-screen="contacts"><img src="assets/icons/contacts.png" alt="" /><span>Contacts</span><small>Private chats</small></button>
      </section>
    </section>

    <section id="placeholder" class="screen placeholder-screen" aria-live="polite">
      <button class="back-btn" data-screen="dashboard">‹</button>
      <img id="placeholderIcon" src="assets/icons/home.png" alt="" />
      <h1 id="placeholderTitle">Ghost</h1>
      <p id="placeholderSub">This section is ready for the next module.</p>
    </section>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-screen="dashboard"><img src="assets/icons/home.png" alt="" /><span>Home</span></button>
      <button class="nav-item" data-screen="hide"><img src="assets/icons/hide.png" alt="" /><span>Hide</span></button>
      <button class="nav-item" data-screen="browser"><img src="assets/icons/browser.png" alt="" /><span>Browser</span></button>
      <button class="nav-item" data-screen="settings"><img src="assets/icons/settings.png" alt="" /><span>Settings</span></button>
    </nav>
  </main>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
