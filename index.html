<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10051f">
<title>Ghost Phoenix v0.02A</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#1c0b35 0,#07030d 42%,#020204 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
.phone{max-width:430px;min-height:100vh;margin:0 auto;padding:136px 22px 104px;position:relative}
.screen{animation:fade .16s ease}
@keyframes fade{from{opacity:.7;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.tile{min-height:120px;padding:13px 7px 11px;border-radius:22px;border:1px solid #6b2da588;background:radial-gradient(circle at 50% 20%,rgba(135,60,255,.18),transparent 42%),linear-gradient(180deg,rgba(13,8,22,.94),rgba(3,3,8,.98));box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 0 22px rgba(135,60,255,.08),0 9px 22px rgba(0,0,0,.72);text-align:center;color:#fff;position:relative;overflow:hidden}
.tile:active{transform:scale(.985)}
.orb{width:58px;height:58px;margin:0 auto 8px;border-radius:999px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#321056 0,#12071f 60%,#040207 100%);border:1px solid rgba(180,92,255,.58);box-shadow:0 0 13px rgba(180,92,255,.75),0 0 28px rgba(135,60,255,.38),inset 0 0 17px rgba(135,60,255,.25)}
.orb:before{content:"";position:absolute;inset:-9px;border-radius:999px;background:radial-gradient(circle,rgba(135,60,255,.45),transparent 67%);filter:blur(2px)}
.orb svg{width:34px;height:34px;fill:none;stroke:#ddb8ff;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #d59cff) drop-shadow(0 0 10px #873cff);position:relative;z-index:1}
.tile span{display:block;font-size:18px;line-height:1.05;font-weight:360;letter-spacing:-.35px;text-shadow:0 1px 7px #000}
.tile small{display:block;margin-top:5px;font-size:11.5px;color:#cbb8ea;font-weight:300}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));z-index:50;min-height:90px;padding:10px 12px;border-radius:32px;background:radial-gradient(circle at 26% 30%,rgba(135,60,255,.13),transparent 34%),linear-gradient(180deg,rgba(12,7,23,.94),rgba(3,3,8,.98));border:1px solid #7c32bd91;box-shadow:inset 0 0 18px rgba(135,60,255,.12),0 8px 24px rgba(0,0,0,.75),0 0 18px rgba(135,60,255,.22);display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;backdrop-filter:blur(14px)}
.divider{width:1px;height:52px;background:#8957c66e;box-shadow:0 0 10px #873cff66}
.nav button{background:transparent;border:0;color:#d9c8ed;display:grid;place-items:center;gap:4px;font-size:12px;font-weight:350}
.navOrb{width:52px;height:52px;border-radius:999px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#321056,#12071f 62%,#050207 100%);border:1px solid #873cff77;box-shadow:0 0 14px rgba(135,60,255,.75),0 0 26px rgba(135,60,255,.34),inset 0 0 16px rgba(135,60,255,.22)}
.nav button.active .navOrb{border-color:#c07aff;box-shadow:0 0 16px #b667ffcc,0 0 34px #873cff77,inset 0 0 18px #873cff44}
.navOrb svg{width:29px;height:29px;fill:none;stroke:#ddb8ff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #d59cff) drop-shadow(0 0 10px #873cff)}
.nav button.active{color:#c979ff}
.calcPage{padding-top:28px}
.calcTitle{text-align:center;font-weight:800;font-size:22px;margin-bottom:15px;color:#ded7e9}
.calcDisplay{height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px;overflow:hidden}
.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calcGrid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:white;font-size:24px;font-weight:700}
.calcGrid .op{background:#33234b;color:#c79bff}
.calcGrid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}
@media(max-width:390px){.phone{padding:128px 20px 104px}.grid{gap:10px}.tile{min-height:112px;padding:12px 6px 10px}.orb{width:52px;height:52px;margin-bottom:7px}.orb svg{width:31px;height:31px}.tile span{font-size:16.5px}.tile small{font-size:10.5px}.nav{min-height:86px}.navOrb{width:49px;height:49px}}
</style>
</head>
<body>
<main id="app" class="phone"></main>
<script>
const app=document.getElementById("app");
const icons={
photo:'<svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="36" rx="8"/><circle cx="24" cy="26" r="5"/><path d="M16 45l13-13 8 8 5-5 8 10"/></svg>',
video:'<svg viewBox="0 0 64 64"><rect x="9" y="16" width="36" height="32" rx="8"/><path d="M45 27l12-7v24l-12-7z"/></svg>',
files:'<svg viewBox="0 0 64 64"><path d="M11 18h19l6 7h17v25H11z"/><path d="M11 25h42"/></svg>',
notes:'<svg viewBox="0 0 64 64"><rect x="15" y="10" width="34" height="44" rx="6"/><path d="M23 24h18M23 33h18M23 42h11"/></svg>',
browser:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="23"/><path d="M9 32h46M32 9c8 8 8 38 0 46M32 9c-8 8-8 38 0 46"/></svg>',
contacts:'<svg viewBox="0 0 64 64"><path d="M22 42c1-11 19-11 20 0"/><path d="M22 44c-8-5-10-18-2-27 7-8 17-8 24 0 8 9 6 22-2 27"/><circle cx="26" cy="28" r="3"/><circle cx="38" cy="28" r="3"/></svg>',
home:'<svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z"/></svg>',
hide:'<svg viewBox="0 0 64 64"><path d="M7 32s9-15 25-15 25 15 25 15-9 15-25 15S7 32 7 32z"/><path d="M17 50L50 14"/></svg>'
};
function nav(active){return '<div class="nav"><button class="'+(active==='home'?'active':'')+'" onclick="renderDashboard()"><span class="navOrb">'+icons.home+'</span>Home</button><div class="divider"></div><button class="'+(active==='hide'?'active':'')+'" onclick="renderCalculator()"><span class="navOrb">'+icons.hide+'</span>Hide</button></div>'}
function tile(name,sub,icon){return '<button class="tile" onclick="alert(\''+name+' shell coming next\')"><span class="orb">'+icon+'</span><span>'+name+'</span><small>'+sub+'</small></button>'}
function renderDashboard(){app.innerHTML='<section class="screen"><div class="grid">'+tile('Photo Vault','Pictures & albums',icons.photo)+tile('Video Vault','Clips & private videos',icons.video)+tile('Files Vault','Documents & folders',icons.files)+tile('Notes Vault','Private notes',icons.notes)+tile('Browser','Secure search',icons.browser)+tile('Contacts','Private chats',icons.contacts)+'</div>'+nav('home')+'</section>'}
function renderCalculator(){app.innerHTML='<section class="screen calcPage"><div class="calcTitle">Calculator</div><div class="calcDisplay" id="calcDisplay">0</div><div class="calcGrid">'+["C","±","%","÷","7","8","9","×","4","5","6","-","1","2","3","+","0",".","⌫","="].map(x=>'<button class="'+(["÷","×","-","+","="].includes(x)?"op":"")+' '+(x==="="?"eq":"")+'" onclick="calcPress(\''+x+'\')">'+x+'</button>').join("")+'</div>'+nav('hide')+'</section>'}
let calcValue="0";function calcPress(x){if(x==="C")calcValue="0";else if(x==="⌫")calcValue=calcValue.length>1?calcValue.slice(0,-1):"0";else if(x==="="){try{calcValue=String(Function("return "+calcValue.replaceAll("×","*").replaceAll("÷","/"))())}catch(e){calcValue="Error"}}else{if(calcValue==="0"||calcValue==="Error")calcValue=x;else calcValue+=x}const d=document.getElementById("calcDisplay");if(d)d.textContent=calcValue}
renderDashboard();
</script>
</body>
</html>
