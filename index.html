<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10051f">
<title>Ghost Phoenix v0.03</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,rgba(122,52,187,.42) 0,rgba(42,14,76,.32) 26%,rgba(7,3,13,.96) 58%,#020204 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#app{max-width:430px;min-height:100vh;margin:0 auto}.phone{min-height:100vh;padding:132px 22px 112px;position:relative}.screen{animation:fadeIn .16s ease}@keyframes fadeIn{from{opacity:.72;transform:translateY(4px)}to{opacity:1;transform:none}}.header-reserve{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(430px,100vw);height:118px;pointer-events:none}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.dash-card{min-height:118px;border:1px solid rgba(143,69,255,.46);border-radius:25px;padding:13px 8px 11px;color:#fff;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,rgba(135,60,255,.22),transparent 43%),linear-gradient(180deg,rgba(16,9,28,.95),rgba(3,3,8,.99));box-shadow:inset 0 0 0 1px rgba(255,255,255,.045),inset 0 0 26px rgba(135,60,255,.10),0 10px 24px rgba(0,0,0,.72);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}.dash-card:active{transform:scale(.982);border-color:rgba(205,141,255,.75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 0 30px rgba(135,60,255,.16),0 0 20px rgba(135,60,255,.24),0 10px 24px rgba(0,0,0,.72)}.dash-card::before{content:"";position:absolute;inset:-35%;background:radial-gradient(circle at 50% 50%,rgba(185,108,255,.18),transparent 42%),conic-gradient(from 180deg,transparent,rgba(135,60,255,.10),transparent,rgba(227,197,255,.08),transparent);opacity:.72;filter:blur(1px);pointer-events:none}.icon-orb{width:56px;height:56px;margin:0 auto 8px;border-radius:999px;display:grid;place-items:center;position:relative;isolation:isolate;background:radial-gradient(circle at 48% 38%,rgba(227,197,255,.24),rgba(185,108,255,.20) 28%,rgba(62,18,111,.88) 52%,rgba(12,5,22,.98) 100%);border:1px solid rgba(185,108,255,.62);box-shadow:0 0 12px rgba(185,108,255,.82),0 0 26px rgba(135,60,255,.42),inset 0 0 18px rgba(135,60,255,.28)}.icon-orb::before{content:"";position:absolute;inset:-8px;border-radius:999px;background:radial-gradient(circle,rgba(135,60,255,.40),transparent 67%);filter:blur(2px);z-index:-1}.icon-orb::after{content:"";position:absolute;inset:8px 9px auto auto;width:13px;height:13px;border-radius:999px;background:rgba(255,255,255,.16);filter:blur(.5px)}.icon-orb svg{width:32px;height:32px;fill:none;stroke:#e6caff;stroke-width:2.65;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(227,197,255,.75)) drop-shadow(0 0 10px rgba(135,60,255,.75));position:relative;z-index:2}.ghost-icon{width:34px;height:34px;position:relative;z-index:2;filter:drop-shadow(0 0 6px rgba(227,197,255,.85)) drop-shadow(0 0 12px rgba(135,60,255,.8))}.ghost-icon::before{content:"";position:absolute;inset:2px 5px 4px;background:#e6caff;border-radius:15px 15px 8px 8px;clip-path:polygon(0 6%,100% 6%,100% 81%,84% 69%,68% 84%,50% 70%,32% 84%,16% 69%,0 81%)}.ghost-icon::after{content:"";position:absolute;top:14px;left:12px;width:4px;height:4px;border-radius:50%;background:#15071f;box-shadow:9px 0 0 #15071f}.dash-card span{position:relative;z-index:1;display:block;font-size:17px;line-height:1.06;font-weight:390;letter-spacing:-.35px;text-shadow:0 1px 7px rgba(0,0,0,.95)}.dash-card small{position:relative;z-index:1;display:block;margin-top:5px;font-size:10.8px;color:#cbb8ea;font-weight:300}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));min-height:88px;padding:10px 12px;border-radius:34px;z-index:50;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;background:radial-gradient(circle at 25% 30%,rgba(135,60,255,.15),transparent 34%),radial-gradient(circle at 75% 35%,rgba(185,108,255,.10),transparent 32%),linear-gradient(180deg,rgba(12,7,23,.95),rgba(3,3,8,.98));border:1px solid rgba(124,50,189,.58);box-shadow:inset 0 0 20px rgba(135,60,255,.13),0 8px 24px rgba(0,0,0,.78),0 0 20px rgba(135,60,255,.20);backdrop-filter:blur(14px)}.nav-divider{width:1px;height:51px;background:rgba(148,94,204,.42);box-shadow:0 0 12px rgba(135,60,255,.55)}.nav-btn{border:0;background:transparent;color:#d9c8ed;display:grid;place-items:center;gap:4px;font-size:12px;font-weight:350}.nav-orb{width:51px;height:51px;border-radius:999px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 48% 38%,rgba(227,197,255,.20),rgba(185,108,255,.16) 30%,rgba(48,16,86,.95) 58%,rgba(6,2,10,.98) 100%);border:1px solid rgba(135,60,255,.55);box-shadow:0 0 13px rgba(135,60,255,.70),0 0 25px rgba(135,60,255,.28),inset 0 0 16px rgba(135,60,255,.23)}.nav-btn.active .nav-orb{border-color:rgba(205,141,255,.92);box-shadow:0 0 16px rgba(185,108,255,.86),0 0 34px rgba(135,60,255,.58),inset 0 0 18px rgba(135,60,255,.34)}.nav-orb svg{width:28px;height:28px;fill:none;stroke:#e6caff;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(227,197,255,.75)) drop-shadow(0 0 10px rgba(135,60,255,.7))}.nav-btn.active{color:#ca7dff}.calc-screen{padding:28px 22px 112px}.calc-title{text-align:center;font-size:22px;font-weight:800;color:#ded7e9;margin-bottom:15px}.calc-display{height:92px;border-radius:22px;background:#05050a;border:1px solid #35204d;box-shadow:inset 0 0 18px rgba(135,60,255,.09);margin-bottom:14px;padding:18px;text-align:right;font-size:38px;overflow:hidden}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calc-grid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:#fff;font-size:24px;font-weight:700}.calc-grid .op{background:#33234b;color:#c79bff}.calc-grid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}@media(max-width:390px){.phone{padding:126px 20px 108px}.dashboard-grid{gap:10px}.dash-card{min-height:110px;padding:11px 6px 10px;border-radius:23px}.icon-orb{width:50px;height:50px;margin-bottom:7px}.icon-orb svg{width:29px;height:29px}.ghost-icon{width:31px;height:31px}.dash-card span{font-size:16px}.dash-card small{font-size:10px}.bottom-nav{min-height:84px}.nav-orb{width:48px;height:48px}.nav-orb svg{width:27px;height:27px}}
</style></head><body><main id="app"></main><script>
const app=document.getElementById('app');
const icons={photo:`<svg viewBox="0 0 64 64"><rect x="10" y="15" width="44" height="34" rx="8"/><circle cx="24" cy="27" r="4.6"/><path d="M16 45l13-12 8 7 5-5 8 10"/></svg>`,video:`<svg viewBox="0 0 64 64"><rect x="10" y="17" width="34" height="30" rx="8"/><path d="M44 27l11-7v24l-11-7z"/><path d="M19 27h14"/></svg>`,files:`<svg viewBox="0 0 64 64"><path d="M11 19h18l6 7h18v24H11z"/><path d="M11 26h42"/><path d="M20 37h24"/></svg>`,notes:`<svg viewBox="0 0 64 64"><rect x="16" y="10" width="32" height="44" rx="7"/><path d="M24 23h16M24 32h16M24 41h10"/><path d="M42 10v9h6"/></svg>`,browser:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22"/><path d="M10 32h44M32 10c7 8 7 36 0 44M32 10c-7 8-7 36 0 44"/></svg>`,home:`<svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z"/></svg>`,hide:`<svg viewBox="0 0 64 64"><path d="M7 32s9-15 25-15 25 15 25 15-9 15-25 15S7 32 7 32z"/><path d="M17 50L50 14"/></svg>`};
function nav(active){return `<nav class="bottom-nav"><button class="nav-btn ${active==='home'?'active':''}" onclick="renderDashboard()"><span class="nav-orb">${icons.home}</span>Home</button><div class="nav-divider"></div><button class="nav-btn ${active==='hide'?'active':''}" onclick="renderCalculator()"><span class="nav-orb">${icons.hide}</span>Hide</button></nav>`}
function card(title,subtitle,icon,type){const visual=type==='ghost'?`<span class="icon-orb"><span class="ghost-icon"></span></span>`:`<span class="icon-orb">${icon}</span>`;return `<button class="dash-card" onclick="comingSoon('${title}')">${visual}<span>${title}</span><small>${subtitle}</small></button>`}
function comingSoon(name){alert(`${name} shell coming next`)}
function renderDashboard(){app.innerHTML=`<section class="phone screen"><div class="header-reserve"></div><div class="dashboard-grid">${card('Photo Vault','Pictures & albums',icons.photo)}${card('Video Vault','Clips & private videos',icons.video)}${card('Files Vault','Documents & folders',icons.files)}${card('Notes Vault','Private notes',icons.notes)}${card('Browser','Secure search',icons.browser)}${card('Contacts','Private chats','', 'ghost')}</div>${nav('home')}</section>`}
function renderCalculator(){app.innerHTML=`<section class="phone calc-screen screen"><div class="calc-title">Calculator</div><div class="calc-display" id="calcDisplay">0</div><div class="calc-grid">${['C','±','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','⌫','='].map(k=>`<button class="${['÷','×','-','+','='].includes(k)?'op':''} ${k==='='?'eq':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div>${nav('hide')}</section>`}
let calcValue='0';function calcPress(key){if(key==='C')calcValue='0';else if(key==='⌫')calcValue=calcValue.length>1?calcValue.slice(0,-1):'0';else if(key==='='){try{calcValue=String(Function('return '+calcValue.replaceAll('×','*').replaceAll('÷','/'))())}catch(e){calcValue='Error'}}else if(key==='±'){if(calcValue!=='0'&&calcValue!=='Error')calcValue=calcValue.startsWith('-')?calcValue.slice(1):'-'+calcValue}else calcValue=(calcValue==='0'||calcValue==='Error')?key:calcValue+key;const display=document.getElementById('calcDisplay');if(display)display.textContent=calcValue}
renderDashboard();
</script></body></html>
