<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghost Phoenix Dashboard</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b0a33 0,#08030f 45%,#020204 100%);color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button{font:inherit;color:inherit}.app{max-width:430px;min-height:100vh;margin:0 auto;padding:72px 22px 118px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{height:154px;border:1px solid rgba(155,72,255,.65);border-radius:26px;background:radial-gradient(circle at 50% 22%,rgba(142,57,255,.26),transparent 48%),linear-gradient(180deg,#0d0718,#030206);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 0 28px rgba(135,60,255,.12),0 12px 26px rgba(0,0,0,.78);padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}.orb{width:82px;height:82px;border-radius:50%;margin-bottom:14px;display:grid;place-items:center;background:radial-gradient(circle at 45% 35%,#e8c9ff33,#b86cff44 28%,#47117b 58%,#07020d 100%);border:1px solid rgba(205,133,255,.75);box-shadow:0 0 18px rgba(190,95,255,.95),0 0 44px rgba(135,60,255,.55),inset 0 0 24px rgba(135,60,255,.38);position:relative}.orb:before{content:"";position:absolute;inset:-13px;border-radius:50%;background:conic-gradient(from 120deg,transparent,rgba(155,57,255,.42),transparent,rgba(230,190,255,.25),transparent);filter:blur(3px)}svg{width:50px;height:50px;fill:none;stroke:#e8caff;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #e0b4ff) drop-shadow(0 0 13px #873cff);position:relative;z-index:1}.ghost{width:52px;height:52px;position:relative;z-index:1;filter:drop-shadow(0 0 7px #e0b4ff) drop-shadow(0 0 14px #873cff)}.ghost:before{content:"";position:absolute;inset:5px 8px 6px;background:#e8caff;border-radius:24px 24px 12px 12px;clip-path:polygon(0 6%,100% 6%,100% 80%,84% 69%,68% 84%,50% 70%,32% 84%,16% 69%,0 80%)}.ghost:after{content:"";position:absolute;top:23px;left:20px;width:5px;height:5px;border-radius:50%;background:#15071f;box-shadow:13px 0 0 #15071f}.card b{font-size:21px;font-weight:400;line-height:1.05}.card span{margin-top:8px;color:#cfb8ee;font-size:13px;font-weight:300}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(386px,calc(100vw - 32px));height:92px;border-radius:36px;border:1px solid rgba(155,72,255,.65);background:radial-gradient(circle at 25% 35%,rgba(155,57,255,.20),transparent 38%),linear-gradient(180deg,#0b0615,#030206);box-shadow:inset 0 0 22px rgba(135,60,255,.14),0 10px 28px rgba(0,0,0,.82),0 0 26px rgba(135,60,255,.26);display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;padding:10px 12px}.line{width:1px;height:55px;background:rgba(180,120,230,.45);box-shadow:0 0 12px #873cff}.nav button{background:transparent;border:0;display:grid;place-items:center;gap:4px;color:#e4d7f2;font-size:13px}.nav .active{color:#c979ff}.navOrb{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 45% 35%,#e8c9ff28,#b86cff36 28%,#411275 58%,#07020d 100%);border:1px solid rgba(205,133,255,.75);box-shadow:0 0 17px rgba(190,95,255,.85),0 0 36px rgba(135,60,255,.45),inset 0 0 20px rgba(135,60,255,.30)}.nav .active .navOrb{box-shadow:0 0 22px rgba(215,163,255,.95),0 0 48px rgba(135,60,255,.65),inset 0 0 22px rgba(135,60,255,.42)}.navOrb svg{width:34px;height:34px}.calc{display:none;max-width:430px;min-height:100vh;margin:0 auto;padding:28px 22px 118px}.calcTitle{text-align:center;font-weight:800;font-size:22px;margin-bottom:15px;color:#ded7e9}.calcDisplay{height:92px;border-radius:20px;background:#05050a;border:1px solid #35204d;margin-bottom:14px;padding:18px;text-align:right;font-size:38px}.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calcGrid button{height:64px;border:0;border-radius:18px;background:#1b1a23;color:white;font-size:24px;font-weight:700}.calcGrid .op{background:#33234b;color:#c79bff}.calcGrid .eq{background:linear-gradient(180deg,#974eff,#611ee4)}@media(max-width:390px){.app{padding:70px 20px 112px}.grid{gap:11px}.card{height:146px}.orb{width:76px;height:76px}svg{width:47px;height:47px}}
</style>
</head>
<body>
<main id="dash" class="app"><div class="grid">
<button class="card"><div class="orb"><svg viewBox="0 0 64 64"><rect x="10" y="15" width="44" height="34" rx="8"/><circle cx="24" cy="27" r="5"/><path d="M16 45l13-12 8 7 5-5 8 10"/></svg></div><b>Photo Vault</b><span>Pictures & albums</span></button>
<button class="card"><div class="orb"><svg viewBox="0 0 64 64"><rect x="10" y="17" width="34" height="30" rx="8"/><path d="M44 27l11-7v24l-11-7z"/></svg></div><b>Video Vault</b><span>Clips & private videos</span></button>
<button class="card"><div class="orb"><svg viewBox="0 0 64 64"><path d="M11 20h18l6 7h18v23H11z"/><path d="M11 27h42"/></svg></div><b>Files Vault</b><span>Documents & folders</span></button>
<button class="card"><div class="orb"><svg viewBox="0 0 64 64"><rect x="17" y="10" width="30" height="44" rx="6"/><path d="M25 23h14M25 32h14M25 41h9"/><path d="M41 10v9h6"/></svg></div><b>Notes Vault</b><span>Private notes</span></button>
<button class="card"><div class="orb"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22"/><path d="M10 32h44M32 10c7 8 7 36 0 44M32 10c-7 8-7 36 0 44"/></svg></div><b>Browser</b><span>Secure search</span></button>
<button class="card"><div class="orb"><span class="ghost"></span></div><b>Contacts</b><span>Private chats</span></button>
</div><nav class="nav"><button class="active" onclick="showDash()"><span class="navOrb"><svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z"/></svg></span>Home</button><div class="line"></div><button onclick="showCalc()"><span class="navOrb"><svg viewBox="0 0 64 64"><path d="M7 32s9-15 25-15 25 15 25 15-9 15-25 15S7 32 7 32z"/><path d="M17 50L50 14"/></svg></span>Hide</button></nav></main>
<main id="calc" class="calc"><div class="calcTitle">Calculator</div><div class="calcDisplay" id="display">0</div><div class="calcGrid"><button onclick="press('C')">C</button><button onclick="press('±')">±</button><button onclick="press('%')">%</button><button class="op" onclick="press('÷')">÷</button><button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('×')">×</button><button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('-')">-</button><button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button><button onclick="press('0')">0</button><button onclick="press('.')">.</button><button onclick="press('⌫')">⌫</button><button class="op eq" onclick="press('=')">=</button></div><nav class="nav"><button onclick="showDash()"><span class="navOrb"><svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z"/></svg></span>Home</button><div class="line"></div><button class="active" onclick="showCalc()"><span class="navOrb"><svg viewBox="0 0 64 64"><path d="M7 32s9-15 25-15 25 15 25 15-9 15-25 15S7 32 7 32z"/><path d="M17 50L50 14"/></svg></span>Hide</button></nav></main>
<script>function showCalc(){dash.style.display='none';calc.style.display='block'}function showDash(){calc.style.display='none';dash.style.display='block'}let value='0';function press(k){if(k==='C')value='0';else if(k==='⌫')value=value.length>1?value.slice(0,-1):'0';else if(k==='='){try{value=String(Function('return '+value.replaceAll('×','*').replaceAll('÷','/'))())}catch(e){value='Error'}}else if(k==='±'){if(value!=='0'&&value!=='Error')value=value.startsWith('-')?value.slice(1):'-'+value}else value=(value==='0'||value==='Error')?k:value+k;display.textContent=value}</script>
</body></html>
